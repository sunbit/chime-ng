name: Build and offline tests
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: python -m pip install -r requirements.txt -r tools/requirements.txt
      - run: pio run -e chime-en
      - run: python tests/run.py
      # No artifact upload: the binary embeds a locally generated setup password.
